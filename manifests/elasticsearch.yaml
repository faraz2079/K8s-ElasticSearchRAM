apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-data
  namespace: __NAMESPACE__
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: __ES_STORAGE__
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: __NAMESPACE__
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh","-c","chown -R 1000:1000 /usr/share/elasticsearch/data"]
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        securityContext:
          runAsUser: 0
      - name: increase-vm-max-map
        image: busybox:1.36
        command: ["sh","-c","sysctl -w vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms__ES_HEAP_SIZE__ -Xmx__ES_HEAP_SIZE__"
        - name: cluster.name
          value: stress-cluster
        - name: bootstrap.memory_lock
          value: "true"
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        resources:
          requests:
            cpu: "__ES_CPU_REQUEST__"
            memory: "__ES_MEM_REQUEST__"
          limits:
            cpu: "__ES_CPU_LIMIT__"
            memory: "__ES_MEM_LIMIT__"
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: es-data
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: __NAMESPACE__
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
